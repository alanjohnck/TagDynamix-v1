<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Command arrow - static -->
  <path 
    d="M16.6667 70.8335L41.6667 45.8335L16.6667 20.8335" 
    stroke="black" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Cursor line with blink effect -->
  <path 
    d="M50.0001 79.1668H83.3334" 
    stroke="black" 
    stroke-width="4" 
  >
    <animate
      attributeName="stroke-dashoffset"
      values="0;6"
      dur="0.75s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0;0.4;1"
      dur="1.5s"
      repeatCount="indefinite"
    />
  </path>
</svg>